    name: arXiv AI search
    type: rss
    source_type: arxiv
    trust_tier: useful_but_verify
    url: "http://export.arxiv.org/rss/cs.AI"
    rss_url: http://export.arxiv.org/rss/cs.AI
    is_active: true
    enabled: true
    notes: "Useful for paper discovery; factual claims still need careful interpretation."
